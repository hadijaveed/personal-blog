html,body{margin:0;padding:0;background:#ffffff;}

<div id="c">
<svg id="svg" width="1200" height="1200"></svg>
<div class="t title">you delegate. it runs the loop.</div>
<div class="t n" style="left:60px;top:170px;width:320px;height:140px;">you text<br>one line</div>
<div class="t n" style="left:770px;top:170px;width:340px;height:140px;">it plans<br>the steps</div>

<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<script>
const svg=document.getElementById('svg');const rc=rough.svg(svg);let seed=1;
const base={roughness:1.1,bowing:1,strokeWidth:3,stroke:'#1e1e1e'};
function rr(x,y,w,h,fill,r=24){
  const d=`M${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x+r},${y+h} Q${x},${y+h} ${x},${y+h-r} L${x},${y+r} Q${x},${y} ${x+r},${y} Z`;
  const o=Object.assign({},base,{seed:seed++});
  if(fill){o.fill=fill;o.fillStyle='solid';}
  svg.appendChild(rc.path(d,o));
}
function arrow(x1,y1,cx,cy,x2,y2,dash){
  const o={roughness:1,bowing:1,strokeWidth:3,stroke:'#1e1e1e',seed:seed++};
  if(dash)o.strokeLineDash=[10,10];
  svg.appendChild(rc.path(`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`,o));
  const a=Math.atan2(y2-cy,x2-cx),L=18,s=0.45;
  const h={roughness:1,bowing:1,strokeWidth:3,stroke:'#1e1e1e'};
  svg.appendChild(rc.line(x2,y2,x2-L*Math.cos(a-s),y2-L*Math.sin(a-s),Object.assign({seed:seed++},h)));
  svg.appendChild(rc.line(x2,y2,x2-L*Math.cos(a+s),y2-L*Math.sin(a+s),Object.assign({seed:seed++},h)));
}
rr(60,170,320,140,'#a5d8ff');
rr(770,170,340,140,null);
rr(780,450,370,150,'#ffec99');
rr(710,760,420,200,'#ffc9c9');
rr(70,900,350,140,'#b2f2bb');
svg.appendChild(rc.ellipse(210,605,340,170,Object.assign({},base,{seed:seed++,fill:'#d0bfff',fillStyle:'solid'})));
arrow(395,235,575,175,755,235);          // 1 -> 2
arrow(1000,322,1045,385,1000,440);       // 2 -> 3
arrow(960,612,990,690,945,748);          // 3 -> 4
arrow(700,880,600,985,435,965);          // 4 -> 5
arrow(225,888,265,790,225,703,true);     // 5 -> 6 dashed
arrow(195,508,165,415,200,322);          // 6 -> 1
</script>
