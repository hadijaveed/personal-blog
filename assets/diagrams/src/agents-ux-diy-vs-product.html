<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>same capability, different setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 1500px; overflow: hidden; }
body {
  font-family: 'Patrick Hand', cursive; color: #2b2925; -webkit-font-smoothing: antialiased;
  background-color: #fbfaf6;
  background-image: radial-gradient(circle, rgba(58,55,51,0.14) 1.2px, transparent 1.8px);
  background-size: 28px 28px; background-position: 14px 14px;
}
.page { width: 1200px; height: 1500px; position: relative; }
svg#sketch { position: absolute; inset: 0; width: 1200px; height: 1500px; pointer-events: none; }
.title { position: absolute; left: 70px; top: 34px; font-family: 'Caveat', cursive; font-weight: 700; font-size: 70px; transform: rotate(-0.8deg); white-space: nowrap; }
.node { position: absolute; text-align: center; line-height: 1.08; white-space: nowrap; }
.note { position: absolute; font-family: 'Caveat', cursive; font-weight: 700; font-size: 40px; line-height: 1.05; white-space: nowrap; }
.bubble { position: absolute; font-size: 58px; white-space: nowrap; }
</style>
</head>
<body>
<div class="page">
  <svg id="sketch"></svg>
  <div class="title" id="title">same capability, different setup</div>

  <div class="node" data-n="A" data-c="210,300" data-r="-1" style="font-size:50px">a server</div>
  <div class="node" data-n="B" data-c="740,272" data-r="0.8" style="font-size:44px">model API keys</div>
  <div class="node" data-n="C" data-c="340,565" data-r="-0.6" style="font-size:46px">Telegram bridge</div>
  <div class="node" data-n="D" data-c="905,505" data-r="1" style="font-size:42px">browser control</div>
  <div class="node" data-n="E" data-c="640,805" data-r="-0.9" style="font-size:42px">cron and<br>monitoring loops</div>
  <div class="node" data-n="F" data-c="225,865" data-r="0.7" style="font-size:44px">skills I wrote<br>by hand</div>

  <div class="note" id="n1" style="left:870px; top:760px; transform:rotate(-1deg)">my Hermes setup,<br>months of evenings</div>

  <div class="note" id="vs" style="left:880px; top:1000px; font-size:46px; transform:rotate(0.8deg)">versus</div>

  <div class="bubble" id="bub" style="left:170px; top:1180px; transform:rotate(-0.6deg)">hey, cancel the gym</div>
  <div class="note" id="n2" style="left:870px; top:1330px; transform:rotate(0.9deg)">that is the<br>whole setup</div>
</div>

<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<script>
const svg = document.getElementById('sketch');
const rc = rough.svg(svg);
const GRAPHITE = '#3a3733', RED = '#b5543b';
let seed = 7;
const add = (el, g) => (g || svg).appendChild(el);
function head(px, py, x, y, o) {
  const ho = { ...o }; delete ho.strokeLineDash;
  const a = Math.atan2(y - py, x - px), L = 18;
  ho.seed = seed++; add(rc.line(x, y, x - L * Math.cos(a - 0.5), y - L * Math.sin(a - 0.5), ho));
  ho.seed = seed++; add(rc.line(x, y, x - L * Math.cos(a + 0.5), y - L * Math.sin(a + 0.5), ho));
}
function arrow(pts, o = {}) {
  const opt = { stroke: GRAPHITE, strokeWidth: 3, roughness: 1.3, bowing: 1, seed: seed++, ...o };
  add(rc.curve(pts, opt));
  const n = pts.length;
  head(pts[n - 2][0], pts[n - 2][1], pts[n - 1][0], pts[n - 1][1], opt);
}

document.fonts.ready.then(() => {
  const N = {};
  document.querySelectorAll('.node').forEach(el => {
    const [cx, cy] = el.dataset.c.split(',').map(Number), r = +el.dataset.r;
    const w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = (cx - w / 2) + 'px'; el.style.top = (cy - h / 2) + 'px';
    el.style.transform = `rotate(${r}deg)`;
    const bw = w + 48, bh = h + 36;
    N[el.dataset.n] = { cx, cy, w: bw, h: bh };
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `rotate(${r * 2.8} ${cx} ${cy})`);
    svg.appendChild(g);
    add(rc.rectangle(cx - bw / 2, cy - bh / 2, bw, bh, { stroke: GRAPHITE, strokeWidth: 3.4, roughness: 1.6, bowing: 1.3, seed: seed++ }), g);
  });
  // point just outside a node edge: fx, fy in [-1,1]
  const P = (k, fx, fy) => { const n = N[k]; return [n.cx + fx * (n.w / 2 + 12), n.cy + fy * (n.h / 2 + 12)]; };

  // title underline (graphite)
  const t = document.getElementById('title');
  add(rc.line(72, 128, 72 + t.offsetWidth * 0.62, 132, { stroke: GRAPHITE, strokeWidth: 3, roughness: 2.2, bowing: 2, seed: seed++ }));

  // tangled wiring
  arrow([P('A', 1, -0.3), [470, 190], P('B', -1, -0.2)]);
  arrow([P('A', 0.7, 1), [560, 420], P('D', -1, -0.1)]);
  arrow([P('B', -0.5, 1), [520, 430], P('C', 0.6, -1)]);
  arrow([P('C', 0.4, 1), [470, 700], P('E', -1, -0.3)]);
  arrow([P('D', -0.1, 1), [830, 680], P('E', 1, -0.3)]);
  arrow([P('F', 0.1, -1), [215, 720], P('C', -0.6, 1)]);
  arrow([P('D', 0.1, -1), [960, 380], P('B', 0.8, 1)]);
  arrow([P('A', -0.2, 1), [240, 430], P('C', -0.4, -1)]);
  arrow([P('B', 1, -0.2), [1110, 300], P('D', 0.7, -1)]);
  arrow([P('C', 1, 0.2), [640, 640], P('D', -0.8, 1)]);
  arrow([P('E', -0.7, 1), [430, 945], P('F', 1, 0.2)]);
  // two dashed feedback loops
  arrow([P('E', 0, -1), [610, 520], [690, 400], P('B', -0.2, 1)], { strokeLineDash: [12, 10] });
  arrow([P('F', -0.7, -1), [55, 600], P('A', -0.6, 1)], { strokeLineDash: [12, 10] });

  // margin note 1 arrow into the board
  const n1 = document.getElementById('n1');
  arrow([[n1.offsetLeft + 150, n1.offsetTop - 8], [1085, 680], [1050, 590]], { strokeWidth: 3, roughness: 1.1 });

  // versus divider
  add(rc.line(560, 1030, 850, 1026, { stroke: RED, strokeWidth: 3.4, roughness: 2, bowing: 2, seed: seed++ }));

  // speech bubble around text
  const b = document.getElementById('bub');
  const x = b.offsetLeft - 70, y = b.offsetTop - 55, w = b.offsetWidth + 140, h = b.offsetHeight + 110, r = 50;
  const d = `M ${x + r} ${y} L ${x + w - r} ${y} Q ${x + w} ${y} ${x + w} ${y + r} L ${x + w} ${y + h - r} Q ${x + w} ${y + h} ${x + w - r} ${y + h}
    L ${x + 190} ${y + h} L ${x + 110} ${y + h + 70} L ${x + 130} ${y + h} L ${x + r} ${y + h} Q ${x} ${y + h} ${x} ${y + h - r} L ${x} ${y + r} Q ${x} ${y} ${x + r} ${y} Z`;
  add(rc.path(d, { stroke: RED, strokeWidth: 4, roughness: 1.2, bowing: 1, fill: 'rgba(181,84,59,0.11)', fillStyle: 'hachure', hachureGap: 14, fillWeight: 1.2, seed: seed++ }));

  // margin note 2 arrow to bubble
  const n2 = document.getElementById('n2');
  arrow([[n2.offsetLeft - 10, n2.offsetTop + 30], [x + w + 50, n2.offsetTop - 10], [x + w + 12, y + h - 40]], { roughness: 1.1 });
});
</script>
</body>
</html>
