<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#111111;--accent:#c2410c;--bg:#ffffff;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:1500px;background:var(--bg);}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    color:var(--ink);
    padding:48px 40px;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  h1{font-size:64px;font-weight:700;line-height:1.12;letter-spacing:-0.5px;margin-bottom:34px;}
  .pipe{flex:1;display:flex;flex-direction:column;align-items:stretch;}
  .box{
    border:3px solid var(--ink);
    border-radius:16px;
    padding:34px 32px;
    flex:0 0 auto;
  }
  .box.hot{border-color:var(--accent);border-width:5px;}
  .lbl{font-size:42px;font-weight:700;line-height:1.12;}
  .sub{font-size:32px;font-weight:500;line-height:1.25;}
  .chips{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px;}
  .chip{
    font-size:30px;font-weight:600;line-height:1;
    border:3px solid var(--ink);
    border-radius:999px;
    padding:14px 22px;
  }
  .chip.hot{border-color:var(--accent);color:var(--accent);}
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 28px;
    margin-top:20px;
  }
  .grid div{font-size:32px;font-weight:500;line-height:1.2;}
  .loop{display:flex;align-items:center;gap:28px;}
  .loop .txt{flex:1;}
  .arrow{
    flex:1 1 auto;
    min-height:78px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:14px 0;
  }
  .stem{flex:1 1 auto;width:4px;min-height:34px;background:var(--ink);}
  .head{
    width:0;height:0;
    border-left:15px solid transparent;
    border-right:15px solid transparent;
    border-top:22px solid var(--ink);
  }
</style>
</head>
<body>
  <h1>What we are building at RevelAI</h1>
  <div class="pipe">

    <div class="box">
      <div class="lbl">Every referral source</div>
      <div class="chips">
        <span class="chip">QR</span>
        <span class="chip hot">EHR feed</span>
        <span class="chip">portal</span>
        <span class="chip">fax</span>
        <span class="chip">campaigns</span>
      </div>
    </div>

    <div class="arrow"><div class="stem"></div><div class="head"></div></div>

    <div class="box hot">
      <div class="lbl">Eligibility check</div>
      <div class="grid">
        <div>Chronic MSK pain diagnosis</div>
        <div>Longer than three months</div>
        <div>Not surgical</div>
        <div>Original Medicare</div>
      </div>
    </div>

    <div class="arrow"><div class="stem"></div><div class="head"></div></div>

    <div class="box">
      <div class="lbl">Outreach in the practice's name</div>
    </div>

    <div class="arrow"><div class="stem"></div><div class="head"></div></div>

    <div class="box">
      <div class="loop">
        <div class="txt">
          <div class="lbl">Twelve-month engagement loop</div>
          <div class="sub" style="margin-top:16px">check-ins, outcomes, escalate to the clinician</div>
        </div>
        <svg width="104" height="104" viewBox="0 0 104 104">
          <defs><marker id="c1" markerWidth="6" markerHeight="6" refX="4.6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#111111"/></marker></defs>
          <path d="M 88 52 A 36 36 0 1 1 52 16" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" marker-end="url(#c1)"/>
        </svg>
      </div>
    </div>

  </div>
</body>
</html>
