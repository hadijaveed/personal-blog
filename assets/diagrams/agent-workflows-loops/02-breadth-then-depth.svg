<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="d9480f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d9480f"/></marker><marker id="2b8a3e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2b8a3e"/></marker><marker id="1971c2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1971c2"/></marker><marker id="6741d9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6741d9"/></marker><marker id="c92a2a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c92a2a"/></marker><marker id="1e1e1e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#fffaf2"/><text x="80" y="72.0" fill="#d9480f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="400">EPISODE 02 / 04 - BREADTH THEN DEPTH</text>
<text x="80" y="130.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="700">Start wide. Then go painfully narrow.</text>
<text x="80" y="172.0" fill="#6f6a64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400">Breadth first is for context. Depth first is for changing code. Mixing them is how agents get lost.</text><rect x="190" y="300" width="230" height="95" rx="14" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="220" y="335.0" fill="#d9480f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">orchestrator</text><text x="220" y="365.0" fill="#d9480f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="400">read PRD + repos</text><line x1="420" y1="347" x2="560" y2="270" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="560" y="230" width="250" height="80" rx="14" fill="#ffffff" stroke="#1971c2" stroke-width="2"/><text x="585" y="263.0" fill="#1971c2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">codebase map</text><text x="585" y="290.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">models + APIs</text><line x1="420" y1="347" x2="560" y2="390" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="560" y="350" width="250" height="80" rx="14" fill="#ffffff" stroke="#6741d9" stroke-width="2"/><text x="585" y="383.0" fill="#6741d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">UX options</text><text x="585" y="410.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">states + flows</text><line x1="420" y1="347" x2="560" y2="510" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="560" y="470" width="250" height="80" rx="14" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><text x="585" y="503.0" fill="#c92a2a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">risk list</text><text x="585" y="530.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">auth + data</text><line x1="420" y1="347" x2="560" y2="630" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="560" y="590" width="250" height="80" rx="14" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/><text x="585" y="623.0" fill="#2b8a3e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">test plan</text><text x="585" y="650.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">how to verify</text><line x1="810" y1="390" x2="1020" y2="395" stroke="#2b8a3e" stroke-width="2" marker-end="url(#2b8a3e)"/><text x="860" y="365.0" fill="#6f6a64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400">pick the riskiest slice</text><rect x="1020" y="330" width="340" height="130" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><text x="1055" y="380.0" fill="#2b8a3e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">active fork</text><text x="1055" y="415.0" fill="#2b8a3e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="400">one slice, one thread</text><line x1="1190" y1="460" x2="1190" y2="560" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="1050" y="560" width="280" height="105" rx="14" fill="#ffffff" stroke="#d9480f" stroke-width="2"/><text x="1080" y="595.0" fill="#d9480f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">human in the loop</text><text x="1080" y="625.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">product + architecture calls</text></svg