<text x="80" y="130.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="700">Not every loop should write code.</text>
<text x="80" y="172.0" fill="#6f6a64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400">Most loops should watch, compare, and escalate. The dangerous part is creating infinite fix loops.</text><rect x="120" y="285" width="280" height="100" rx="14" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><text x="150" y="323.0" fill="#c92a2a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">/sentry loop</text><text x="150" y="350.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">every 4 hours</text><line x1="400" y1="335" x2="540" y2="335" stroke="#c92a2a" stroke-width="2" marker-end="url(#c92a2a)"/><rect x="540" y="285" width="280" height="100" rx="14" fill="#fff9db" stroke="#c92a2a" stroke-width="2"/><text x="570" y="323.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">filter</text><text x="570" y="350.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">new errors only</text><line x1="820" y1="335" x2="1030" y2="390" stroke="#c92a2a" stroke-width="2" marker-end="url(#c92a2a)"/><rect x="120" y="435" width="280" height="100" rx="14" fill="#ffffff" stroke="#d9480f" stroke-width="2"/><text x="150" y="473.0" fill="#d9480f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">/cloudwatch loop</text><text x="150" y="500.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">scheduled</text><line x1="400" y1="485" x2="540" y2="485" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="540" y="435" width="280" height="100" rx="14" fill="#fff9db" stroke="#d9480f" stroke-width="2"/><text x="570" y="473.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">filter</text><text x="570" y="500.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">new spikes only</text><line x1="820" y1="485" x2="1030" y2="390" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="120" y="585" width="280" height="100" rx="14" fill="#ffffff" stroke="#6741d9" stroke-width="2"/><text x="150" y="623.0" fill="#6741d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">/data skills loop</text><text x="150" y="650.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">after queries</text><line x1="400" y1="635" x2="540" y2="635" stroke="#6741d9" stroke-width="2" marker-end="url(#6741d9)"/><rect x="540" y="585" width="280" height="100" rx="14" fill="#fff9db" stroke="#6741d9" stroke-width="2"/><text x="570" y="623.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">filter</text><text x="570" y="650.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">catch repeated mistakes</text><line x1="820" y1="635" x2="1030" y2="390" stroke="#6741d9" stroke-width="2" marker-end="url(#6741d9)"/><rect x="1030" y="345" width="330" height="150" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><text x="1060" y="395.0" fill="#2b8a3e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">orchestrator inbox</text><text x="1060" y="430.0" fill="#2b8a3e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="400">triage before action</text><line x1="1190" y1="495" x2="1210" y2="525" stroke="#2b8a3e" stroke-width="2" marker-end="url(#2b8a3e)"/><polygon points="1210,525.0 1335.0,610 1210,695.0 1085.0,610" fill="#ffffff" s