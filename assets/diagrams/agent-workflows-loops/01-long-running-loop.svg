<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="d9480f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d9480f"/></marker><marker id="2b8a3e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2b8a3e"/></marker><marker id="1971c2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1971c2"/></marker><marker id="6741d9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6741d9"/></marker><marker id="c92a2a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c92a2a"/></marker><marker id="1e1e1e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#fffaf2"/><text x="80" y="72.0" fill="#d9480f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="400">EPISODE 02 / 04 - THE LONG RUNNING LOOP</text>
<text x="80" y="130.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="700">An agent is not a task. It is a loop.</text>
<text x="80" y="172.0" fill="#6f6a64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400">Keep one orchestrator alive. It wakes up, reads signals, decides, acts, verifies, and writes back what changed.</text><rect x="130" y="350" width="230" height="110" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><text x="155" y="390.0" fill="#2b8a3e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">production</text><text x="155" y="420.0" fill="#2b8a3e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="400">features live + users</text><line x1="360" y1="405" x2="520" y2="405" stroke="#2b8a3e" stroke-width="2" marker-end="url(#2b8a3e)"/><rect x="520" y="295" width="310" height="210" rx="14" fill="#ffffff" stroke="#d9480f" stroke-width="2"/><text x="555" y="330.0" fill="#d9480f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">signal inbox</text><text x="555" y="370.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400">Sentry errors</text>
<text x="555" y="395.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400">CloudWatch logs</text>
<text x="555" y="420.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400">PR comments</text>
<text x="555" y="445.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400">Slack + Linear</text>
<text x="555" y="470.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400">Data quality checks</text><line x1="830" y1="405" x2="1030" y2="405" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="1030" y="360" width="330" height="105" rx="14" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="1060" y="395.0" fill="#d9480f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">orchestrator /resume</text><text x="1060" y="425.0" fill="#d9480f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="400">read plan + choose next action</text><polygon points="760,540.0 890.0,635 760,730.0 630.0,635" fill="#ffffff" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/><text x="700" y="625.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">is this worth</text>
<text x="700" y="657.5" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">waking me up?</text><line x1="1195" y1="465" x2="870" y2="570" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><line x1="760" y1="730" x2="360" y2="460" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)" stroke-dasharray="8 8"/><line x1="890" y1="640" x2="1140" y2="670" stroke="#2b8a3e" stroke-width="2" marker-end="url(#2b8a3e)"/><rect x="1140" y="625" width="240" height="90" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><text x="1170" y="660.0" fill="#2b8a3e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">ship or close</text><text x="1170" y="685.0" fill="#2b8a3e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="400">write memory</text><rect x="525" y="545" width="330" height="32" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="2"/><text x="545" y="567.0" fill="#d9480f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">/loop - wake up with context</text><rect x="525" y="595" width="330" height="32" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="2"/><text x="545" y="617.0" fill="#d9480f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">/schedule - check every 4 hours</text><rect x="525" y="645" width="330" height="32" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="2"/><text x="545" y="667.0" fill="#d9480f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">/remote-control - trigger from phone</text></svg>