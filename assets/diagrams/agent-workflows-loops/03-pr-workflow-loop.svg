<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="d9480f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d9480f"/></marker><marker id="2b8a3e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2b8a3e"/></marker><marker id="1971c2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1971c2"/></marker><marker id="6741d9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6741d9"/></marker><marker id="c92a2a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c92a2a"/></marker><marker id="1e1e1e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#fffaf2"/><text x="80" y="72.0" fill="#d9480f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="400">EPISODE 02 / 04 - PR WORKFLOW LOOP</text>
<text x="80" y="130.0" fill="#1e1e1e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="700">Stop babysitting the PR.</text>
<text x="80" y="172.0" fill="#6f6a64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400">The PR loop keeps re-reading the branch, CI, review comments, and diff until the work is boring.</text><rect x="120" y="360" width="220" height="90" rx="14" fill="#ffffff" stroke="#1971c2" stroke-width="2"/><text x="145" y="398.0" fill="#1971c2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">read PR</text><text x="145" y="425.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">diff + intent</text><line x1="340" y1="405" x2="405" y2="545" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="405" y="500" width="220" height="90" rx="14" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/><text x="430" y="538.0" fill="#2b8a3e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">run checks</text><text x="430" y="565.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">tests + lint + build</text><line x1="625" y1="545" x2="690" y2="405" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="690" y="360" width="220" height="90" rx="14" fill="#ffffff" stroke="#d9480f" stroke-width="2"/><text x="715" y="398.0" fill="#d9480f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">read feedback</text><text x="715" y="425.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">CI + reviewer comments</text><line x1="910" y1="405" x2="975" y2="545" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="975" y="500" width="220" height="90" rx="14" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><text x="1000" y="538.0" fill="#c92a2a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">patch root cause</text><text x="1000" y="565.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">small fixes only</text><line x1="1195" y1="545" x2="1260" y2="405" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)"/><rect x="1260" y="360" width="220" height="90" rx="14" fill="#ffffff" stroke="#6741d9" stroke-width="2"/><text x="1285" y="398.0" fill="#6741d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">summarize</text><text x="1285" y="425.0" fill="#6f6a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">comment what changed</text><path d="M 1370 405 C 800.0 245, 800.0 200, 230 360" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#d9480f)" stroke-dasharray="8 8"/><rect x="675" y="690" width="260" height="32" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="2"/><text x="695" y="712.0" fill="#d9480f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="400">repeat until green or blocked</text><line x1="1480" y1="405" x2="1120" y2="280" stroke="#2b8a3e" stroke-width="2" marker-end="url(#2b8a3e)"/><rect x="1120" y="235" width="300" height="90" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><text x="1150" y="270.0" fill="#2b8a3e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">done</text><text x="1150" y="300.0" fill="#2b8a3e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="400">mergeable + explained</text></svg>