<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>who pays for the loop?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Kalam:wght@400;700&display=block">
<style>
@font-face { font-family: 'Virgil'; src: url('https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Virgil.woff2') format('woff2'); font-display: block; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 980px; overflow: hidden; }
body { font-family: 'Virgil', 'Gloria Hallelujah', 'Kalam', cursive; color: #1e1e1e; -webkit-font-smoothing: antialiased; background: #ffffff; }
.page { width: 1200px; height: 980px; position: relative; }
svg#sketch { position: absolute; inset: 0; width: 1200px; height: 980px; pointer-events: none; }
.t { position: absolute; line-height: 1.1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.title { position: absolute; font-size: 58px; left: 0; width: 1200px; top: 36px; text-align: center; white-space: nowrap; }
.lbl { font-size: 42px; }
.sub { font-size: 32px; }
.note { font-size: 36px; line-height: 1.25; }
.red { color: #c2410c; }
.green { color: #5d7a52; }
</style>
</head>
<body>
<div class="page">
  <svg id="sketch"></svg>
  <div class="title" >who pays for the loop?</div>
  <div class="t lbl" style="left:60px;top:170px;width:520px;height:100px;">the average consumer</div>
  <div class="t " style="left:80px;top:290px;width:480px;height:380px;"><div class="lbl">pays cash</div><div class="sub" style="margin-top:22px;line-height:1.35">Function Health<br>Neko Health<br>One Medical</div></div>
  <div class="t note" style="left:80px;top:720px;width:500px;height:120px;">still needs a new<br>payment model</div>
  <div class="t lbl" style="left:620px;top:160px;width:540px;height:120px;">boomers with<br>chronic illness</div>
  <div class="t " style="left:640px;top:290px;width:500px;height:380px;"><div class="lbl">Medicare pays</div><div class="sub" style="margin-top:22px;line-height:1.35">ACCESS pays on<br>outcomes, with the<br>PCP in the loop</div></div>
  <div class="t note red" style="left:640px;top:720px;width:500px;height:120px;">the massive<br>opening right now</div>
</div>
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<script>
const svg = document.getElementById('sketch');
const rc = rough.svg(svg);
const INK = '#1e1e1e', RED = '#c2410c', GREEN = '#2f9e44', AMBER = '#e8a317', BLUE = '#1971c2', PLUM = '#7048e8';
const FILL = { red: '#ffc9c9', green: '#b2f2bb', amber: '#ffec99', blue: '#a5d8ff', plum: '#d0bfff' };
let seed = 11;
const add = el => svg.appendChild(el);
const base = o => ({ stroke: INK, strokeWidth: 3, roughness: 1, bowing: 1, seed: seed++, ...o });
function box(x, y, w, h, tint, o = {}) {
  const r = 22;
  const d = `M${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x+r},${y+h} Q${x},${y+h} ${x},${y+h-r} L${x},${y+r} Q${x},${y} ${x+r},${y} Z`;
  const extra = tint ? { fill: FILL[tint], fillStyle: 'solid' } : { fill: '#ffffff', fillStyle: 'solid' };
  add(rc.path(d, base({ ...extra, ...o })));
}
function blob(cx, cy, w, h, tint, o = {}) {
  const extra = tint ? { fill: FILL[tint], fillStyle: 'solid' } : {};
  add(rc.ellipse(cx, cy, w, h, base({ ...extra, ...o })));
}
function line(a, b, c, d, o = {}) { add(rc.line(a, b, c, d, base(o))); }
function head(px, py, x, y, o) {
  const a = Math.atan2(y - py, x - px), L = 20;
  line(x, y, x - L * Math.cos(a - 0.45), y - L * Math.sin(a - 0.45), o);
  line(x, y, x - L * Math.cos(a + 0.45), y - L * Math.sin(a + 0.45), o);
}
function arrow(pts, o = {}) {
  const oo = { roughness: 0.9, strokeWidth: 3, ...o };
  add(rc.curve(pts, base(oo)));
  const n = pts.length; head(pts[n - 2][0], pts[n - 2][1], pts[n - 1][0], pts[n - 1][1], { ...oo, strokeLineDash: undefined });
}
function underline() {}

underline(60, 620, 118);

box(80,290,480,380,'blue');
box(640,290,500,380,'green',{stroke:GREEN,strokeWidth:4});
line(600,180,602,880,{strokeWidth:2,strokeLineDash:[8,12],roughness:1.8});
arrow([[1040,760],[1090,730],[1080,685]],{stroke:RED});

</script>
</body>
</html>
